[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-freelance-tracker"
description = "Alliance Auth plugin to track corporation Freelance Jobs from the EVE Online ESI"
readme = "README.md"
keywords = [
    "allianceauth",
    "eveonline",
    "freelance",
]
license = { file = "LICENSE" }
authors = [
    { name = "Aaron Kable", email = "aaronkable@gmail.com" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5",
    "django-esi>=9.6",
]
urls.Changelog = "https://github.com/Solar-Helix-Independent-Transport/aa-freelance-tracker/blob/master/CHANGELOG.md"
urls.Tracker = "https://github.com/Solar-Helix-Independent-Transport/aa-freelance-tracker/issues"

[tool.hatch]
version.path = "freelance_tracker/__init__.py"
build.include = [
    "/freelance_tracker",
]
