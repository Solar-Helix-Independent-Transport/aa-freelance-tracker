[tox]
requires =
    tox>=4.2
env_list =
    py{314, 313, 312, 311, 310}

[testenv]
deps =
    -e ../django-eve-sde
    allianceauth
    coverage
    django-esi
    django-webtest
set_env =
    DJANGO_SETTINGS_MODULE = testauth.settings.local
commands =
    coverage run runtests.py freelance_tracker -v 2
    coverage report
    coverage xml
install_command = python -m pip install -U {opts} {packages}
